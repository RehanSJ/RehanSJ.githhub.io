function HistoryView({ state, say }) {
  const [openId, setOpenId] = useState(null);

  const week = useMemo(() => {
    const cutoff = Date.now() - 7 * 864e5;
    const ws = state.history.filter(w => (w.finishedAt || 0) > cutoff);
    return { volume: ws.reduce((a, w) => a + (w.totalVolumeKg || 0), 0), count: ws.length };
  }, [state.history]);

  const exportAll = () => {
    copyText(JSON.stringify({ app: 'IronDesk', version: 2, exportedAt: new Date().toISOString(), workouts: state.history }, null, 2))
      .then(() => say('Full history copied. Paste it to Claude for your weekly sync.'));
  };

  if (state.history.length === 0) {
    return (
      <div>
        <h1 className="text-2xl font-bold mb-1">History</h1>
        <p className="text-muted text-sm">Finish a workout and it lands here.</p>
      </div>
    );
  }

  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">History</h1>
      <p className="text-muted text-sm mb-5 num">
        Last 7 days: {Math.round(week.volume).toLocaleString()} kg across {week.count} sessions
      </p>

      <div className="space-y-3">
        {state.history.map(w => (
          <div key={w.id}>
            <button onClick={() => setOpenId(openId === w.id ? null : w.id)} className="w-full text-left">
              <SessionCard w={w} />
            </button>
            {openId === w.id && (
              <div className="bg-raise border border-line border-t-0 rounded-b-2xl -mt-1 p-4 space-y-2">
                {w.exercises.map((e, i) => (
                  <div key={i} className="text-[13px]">
                    <div className="flex justify-between gap-3">
                      <span className="truncate">{e.name}</span>
                      <span className="num text-muted whitespace-nowrap">
                        {(e.type || 'reps') === 'time' ? dur(e.timeSec || 0) : `${(e.volumeKg || 0).toLocaleString()} kg`}
                      </span>
                    </div>
                    <div className="num text-[11px] text-muted mt-0.5">
                      {e.sets.map(st => (e.type === 'time'
                        ? `${st.weightKg ? st.weightKg + 'kg ' : ''}${st.durationSec}s`
                        : `${st.weightKg}×${st.reps}`)).join('  ·  ')}
                    </div>
                  </div>
                ))}
                <button onClick={() => copyText(JSON.stringify(w, null, 2)).then(() => say('Session JSON copied'))}
                  className="w-full mt-2 text-[13px] text-amber border border-amber/40 rounded-lg py-2.5">
                  Copy this session as JSON
                </button>
              </div>
            )}
          </div>
        ))}
      </div>

      <Btn className="w-full mt-5" onClick={exportAll}>Copy full history JSON</Btn>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────
   Settings
   ──────────────────────────────────────────────────────────────── */
function SettingsView({ state, setState, say }) {
  const s = state.settings;
  const set = (k, v) => setState(p => ({ ...p, settings: { ...p.settings, [k]: v } }));

  const [busy, setBusy] = useState('');

  const testHook = async () => {
    const url = s.webhookUrl.trim();
    if (!url) { say('Paste your Apps Script URL first.'); return; }
    try {
      await postWebhook(url, { rows: [[today(), 'Connection test', 'Iron Desk', 'reps', 0, 0, 0, '', '', 0]] });
      say('Test row sent. Check your sheet.');
    } catch (e) {
      say("Couldn't reach the script. Check the URL is the /exec one.");
    }
  };

  const backupLibrary = async () => {
    const url = s.webhookUrl.trim();
    if (!url) { say('Paste your Apps Script URL first.'); return; }
    setBusy('backup');
    try {
      await syncLibraryToSheet(state);
      say(`Backed up ${state.exercises.length} exercises to the Library tab`);
    } catch (e) {
      say("Couldn't reach the script. Check the URL and redeploy.");
    }
    setBusy('');
  };

  const importLibrary = async () => {
    const url = s.webhookUrl.trim();
    if (!url) { say('Paste your Apps Script URL first.'); return; }
    if (!sure('Merge the Library tab into this device? Matching names are overwritten with the sheet version.')) return;
    setBusy('import');
    try {
      const data = await fetchLibrary(url);
      const rows = (data && data.exercises) || [];
      if (!rows.length) { say('The Library tab came back empty.'); setBusy(''); return; }
      let added = 0, updated = 0;
      setState(p => {
        let lib = p.exercises;
        rows.forEach(r => {
          if (!r || !r.name) return;
          const fields = {
            type: r.type === 'time' ? 'time' : 'reps',
            defaultRestSec: (r.defaultRestSec === '' || r.defaultRestSec == null) ? null : Number(r.defaultRestSec),
            note: r.note || '',
            group: r.group || 'Other',
            isFavorite: r.isFavorite === true || String(r.isFavorite).toLowerCase() === 'true'
          };
          const res = addExerciseTo(lib, r.name, fields);
          lib = res.list;
          if (res.added) added++;
          else {
            updated++;
            lib = lib.map(x => x.id === res.exercise.id ? { ...x, ...fields } : x);
          }
        });
        return { ...p, exercises: lib };
      });
      say(`${added} added, ${updated} updated from your sheet`);
    } catch (e) {
      say("Couldn't read the Library tab. Redeploy the script as a new version.");
    }
    setBusy('');
  };

  const restoreCatalogue = () => {
    if (!sure('Add back any built-in movements missing from your library? Your own edits are kept.')) return;
    setState(p => {
      const before = p.exercises.length;
      const next = syncCatalogue(p.exercises);
      setTimeout(() => say(`${next.length - before} movements restored`), 0);
      return { ...p, exercises: next };
    });
  };

  const Toggle = ({ label, hint, k }) => (
    <button onClick={() => set(k, !s[k])}
      className="w-full flex items-center justify-between bg-panel border border-line rounded-xl px-4 py-3.5 text-left">
      <span>
        <span className="block text-[14px]">{label}</span>
        {hint && <span className="block text-[11px] text-muted mt-0.5">{hint}</span>}
      </span>
      <span className={`w-12 h-7 rounded-full p-1 shrink-0 ml-3 ${s[k] ? 'bg-amber' : 'bg-line'}`}>
        <span className={`block w-5 h-5 rounded-full bg-ink transition-transform ${s[k] ? 'translate-x-5' : ''}`} />
      </span>
    </button>
  );

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl font-bold mb-1">Settings</h1>
        <p className="text-muted text-sm">{storageLabel}.</p>
      </div>

      <div>
        <h2 className="text-[11px] uppercase tracking-[0.14em] text-muted mb-3">Google Sheet</h2>
        <Field label="Apps Script web app URL" placeholder="https://script.google.com/macros/s/…/exec"
          value={s.webhookUrl} onChange={e => set('webhookUrl', e.target.value)} />
        <p className="text-[11px] text-muted mt-2 leading-relaxed">
          Deploy the script as a web app with access set to Anyone, then paste the /exec URL here.
          Ten columns: date, workout, exercise, type, set, weight, reps, duration, rpe, volume.
          Form cues aren’t sent — they’re the same every session, so they’d only pad the sheet.
        </p>
        <div className="grid grid-cols-2 gap-3 mt-3">
          <Btn onClick={testHook}>Send a test row</Btn>
          <Btn onClick={() => copyText(APPS_SCRIPT).then(() => say('Apps Script copied'))}>Copy the script</Btn>
        </div>
      </div>

      <div className="space-y-2">
        <h2 className="text-[11px] uppercase tracking-[0.14em] text-muted mb-3">Rest timer</h2>
        <Toggle k="sound" label="Chime when rest ends" />
        <Toggle k="vibrate" label="Vibrate when rest ends" hint="Android and some browsers only" />
        <Toggle k="autoSync" label="Send to sheet on finish" />
        <Field label="Fallback rest (seconds)" inputMode="numeric" value={s.defaultRest}
          onChange={e => set('defaultRest', num(e.target.value))} />
        <p className="text-[11px] text-muted leading-relaxed">
          Only used for exercises with no rest time of their own. Set those per exercise
          on the Exercises screen.
        </p>
        <Btn className="w-full" onClick={() => { beep(3); buzz([220, 90, 220]); }}>Test the alert</Btn>
      </div>

      <div className="space-y-2">
        <h2 className="text-[11px] uppercase tracking-[0.14em] text-muted mb-3">Data</h2>

        <Toggle k="syncLibrary" label="Sync library automatically"
          hint="Pushes to the Library tab a couple of seconds after any add, edit or import" />
        <Btn className="w-full" onClick={backupLibrary} disabled={busy === 'backup'}>
          {busy === 'backup' ? 'Sending…' : `Backup Library to Sheet (${state.exercises.length})`}
        </Btn>
        <Btn className="w-full" onClick={importLibrary} disabled={busy === 'import'}>
          {busy === 'import' ? 'Reading…' : 'Import Library from Sheet'}
        </Btn>
        <Btn className="w-full" onClick={restoreCatalogue}>Restore missing built-in movements</Btn>
        <p className="text-[11px] text-muted leading-relaxed mb-2">
          The Library tab stores {LIBRARY_COLUMNS.join(', ')}. Importing merges by name —
          matching exercises take the sheet’s values, new ones are added, and nothing on this
          device is deleted.
        </p>
        <Btn className="w-full" onClick={() => copyText(JSON.stringify(state, null, 2)).then(() => say('Backup copied'))}>
          Copy a full backup
        </Btn>
        <Btn className="w-full" onClick={() => {
          const t = ask('Paste a backup JSON');
          if (!t) return;
          try {
            const d = JSON.parse(t);
            if (!d.exercises || !d.templates) throw new Error('shape');
            setState(migrate(d));
            say('Backup restored');
          } catch (e) { say("That doesn't look like an Iron Desk backup."); }
        }}>Restore from a backup</Btn>
        <Btn tone="danger" className="w-full" onClick={() => {
          if (sure('Erase all workouts, routines and custom exercises?')) { setState(DEFAULT_STATE); say('Everything reset'); }
        }}>Reset everything</Btn>
      </div>
    </div>
  );
}

const APPS_SCRIPT = `const WORKOUT_SHEET = 'Workouts';
const LIBRARY_SHEET = 'Library';
const WORKOUT_HEADERS = ['date','workout','exercise','type','set','weight_kg','reps','duration_s','rpe','volume_kg'];
const LIBRARY_HEADERS = ['name','type','defaultRestSec','isFavorite','note','group'];

function doPost(e) {
  try {
    const body = JSON.parse(e.postData.contents);
    // Current payload: 2D rows in LIBRARY_HEADERS order.
    if (body.action === 'syncLibrary') return reply(upsertLibrary(body.library || []));
    // Older payload, kept so an app that hasn't updated yet still works.
    if (body.action === 'library.upsert') return reply(upsertLibrary(objectsToRows(body.exercises || [])));
    return reply(appendWorkout(body.rows || []));
  } catch (err) {
    return reply({ ok: false, error: String(err) });
  }
}

function objectsToRows(list) {
  return list.map(function (x) {
    return [
      x.name,
      x.type || 'reps',
      x.defaultRestSec == null ? '' : x.defaultRestSec,
      x.isFavorite === true,
      x.note || '',
      x.group || 'Other'
    ];
  });
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  try {
    if (p.action === 'library') return reply(listLibrary(), p.callback);
    return reply({ ok: true, message: 'Iron Desk webhook is live' }, p.callback);
  } catch (err) {
    return reply({ ok: false, error: String(err) }, p.callback);
  }
}

function sheetFor(name, headers) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
    sh.appendRow(headers);
    sh.getRange(1, 1, 1, headers.length).setFontWeight('bold');
    sh.setFrozenRows(1);
  }
  return sh;
}

function appendWorkout(rows) {
  if (!rows.length) return { ok: false, error: 'No rows in request' };
  const sh = sheetFor(WORKOUT_SHEET, WORKOUT_HEADERS);
  sh.getRange(sh.getLastRow() + 1, 1, rows.length, rows[0].length).setValues(rows);
  return { ok: true, appended: rows.length };
}

function upsertLibrary(rows) {
  if (!rows.length) return { ok: false, error: 'No library rows in request' };
  const sh = sheetFor(LIBRARY_SHEET, LIBRARY_HEADERS);
  const width = LIBRARY_HEADERS.length;
  const last = sh.getLastRow();

  // Map existing names (trimmed, lowercased) to their row number.
  const index = {};
  if (last > 1) {
    const names = sh.getRange(2, 1, last - 1, 1).getValues();
    for (var i = 0; i < names.length; i++) {
      const key = String(names[i][0]).trim().toLowerCase();
      if (key) index[key] = i + 2;
    }
  }

  const fresh = [];
  let updated = 0;
  rows.forEach(function (r) {
    if (!r || !String(r[0] || '').trim()) return;
    // Pad or trim so a short row can never shift the columns.
    const row = [];
    for (var c = 0; c < width; c++) row.push(r[c] === undefined ? '' : r[c]);
    const at = index[String(r[0]).trim().toLowerCase()];
    if (at) { sh.getRange(at, 1, 1, width).setValues([row]); updated++; }
    else fresh.push(row);
  });

  if (fresh.length) sh.getRange(sh.getLastRow() + 1, 1, fresh.length, width).setValues(fresh);
  return { ok: true, added: fresh.length, updated: updated };
}

function listLibrary() {
  const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(LIBRARY_SHEET);
  if (!sh || sh.getLastRow() < 2) return { ok: true, exercises: [] };
  const values = sh.getRange(2, 1, sh.getLastRow() - 1, LIBRARY_HEADERS.length).getValues();
  const out = values.filter(function (r) { return String(r[0]).trim() !== ''; }).map(function (r) {
    return {
      name: String(r[0]).trim(),
      type: String(r[1]).trim() === 'time' ? 'time' : 'reps',
      defaultRestSec: r[2] === '' || r[2] == null ? null : Number(r[2]),
      isFavorite: r[3] === true || String(r[3]).toLowerCase() === 'true',
      note: String(r[4] == null ? '' : r[4]),
      group: String(r[5] == null ? '' : r[5]) || 'Other'
    };
  });
  return { ok: true, exercises: out };
}

// A callback turns this into JSONP, which is how the app reads the sheet
// without fighting Apps Script's redirect and its missing CORS headers.
function reply(obj, callback) {
  const body = JSON.stringify(obj);
  if (callback) {
    return ContentService.createTextOutput(callback + '(' + body + ')')
      .setMimeType(ContentService.MimeType.JAVASCRIPT);
  }
  return ContentService.createTextOutput(body).setMimeType(ContentService.MimeType.JSON);
}`;

    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
