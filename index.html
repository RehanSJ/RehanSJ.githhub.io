<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ────────────────────────────────────────────────────────────────
   Storage — works in three environments, in order of preference:
   1. Claude artifact sandbox (window.storage)
   2. A real browser / installed PWA (localStorage)
   3. Anything else (in-memory, lost on reload)
   ──────────────────────────────────────────────────────────────── */
const KEY = 'irondesk:v1';
const mem = {};
const hasWS = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const hasLS = (() => {
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; }
  catch (e) { return false; }
})();

const store = {
  async load() {
    if (hasWS) {
      try { const r = await window.storage.get(KEY); return r ? JSON.parse(r.value) : null; }
      catch (e) { return null; }
    }
    if (hasLS) {
      try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; }
      catch (e) { return null; }
    }
    return mem[KEY] || null;
  },
  async save(data) {
    const s = JSON.stringify(data);
    if (hasWS) { try { await window.storage.set(KEY, s); return; } catch (e) {} }
    if (hasLS) { try { localStorage.setItem(KEY, s); return; } catch (e) {} }
    mem[KEY] = data;
  }
};
const storageLabel = hasWS ? 'Sandbox storage' : hasLS ? 'Saved on this device' : 'Not saved — this session only';

/* ── Helpers ─────────────────────────────────────────────────── */
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const mmss = s => `${Math.floor(Math.max(0, s) / 60)}:${String(Math.floor(Math.max(0, s)) % 60).padStart(2, '0')}`;
const dur = s => (s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`);

/* Single source of truth for "is this exercise already in the list?".
   Everything that can create an exercise — the library screen, the add
   sheet, and a routine pasted from Claude — routes through here, so a
   name can only ever exist once regardless of casing or stray spaces. */
const normalize = name => String(name || '').trim().toLowerCase();
const findExercise = (list, name) => list.find(ex => normalize(ex.name) === normalize(name));

function addExerciseTo(list, name, opts = {}) {
  const clean = String(name || '').trim();
  if (!clean) return { list, added: false, exercise: null };
  const existing = findExercise(list, clean);
  if (existing) return { list, added: false, exercise: existing };
  const exercise = {
    id: uid(),
    name: clean,
    type: opts.type === 'time' ? 'time' : 'reps',
    defaultRestSec: opts.defaultRestSec != null ? Number(opts.defaultRestSec) : null,
    note: String(opts.note || '').trim(),
    group: opts.group || 'Other',
    isFavorite: !!opts.isFavorite,
    custom: opts.custom !== false
  };
  return { list: [...list, exercise], added: true, exercise };
}

/* Some embedded contexts block confirm() and prompt(). Degrade gracefully:
   a tapped destructive button still works, a tapped input just no-ops. */
function sure(message) {
  try { return window.confirm(message); } catch (e) { return true; }
}
function ask(message, fallback) {
  try { return window.prompt(message, fallback || ''); } catch (e) { return fallback || null; }
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
  return Promise.resolve();
}

/* ── Webhook transport ───────────────────────────────────────── */

/* The Library tab's column order. Kept in one place so the app, the
   Apps Script and the sheet header can't drift apart.
   note carries the form cue; without it a restore gives you back a list
   of bare names rather than a usable library. */
const LIBRARY_COLUMNS = ['name', 'type', 'defaultRestSec', 'isFavorite', 'note', 'group'];

const libraryRows = exercises => exercises.map(e => [
  e.name,
  e.type || 'reps',
  e.defaultRestSec == null ? '' : e.defaultRestSec,
  !!e.isFavorite,
  e.note || '',
  e.group || 'Other'
]);

/* Maps the library into 2D rows and posts them to the webhook. Resolves
   with the script's reply where the browser lets us read it. */
function syncLibraryToSheet(state) {
  const url = (state.settings.webhookUrl || '').trim();
  if (!url) return Promise.reject(new Error('No webhook URL set'));
  return postWebhook(url, { action: 'syncLibrary', library: libraryRows(state.exercises) });
}

function postWebhook(url, payload) {
  // text/plain keeps this a "simple" request, so the browser skips the
  // preflight that Apps Script can't answer.
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
}

/* Reading back is the awkward direction: Apps Script bounces /exec through
   a redirect that often strips CORS. Try a normal fetch, fall back to a
   JSONP script tag, which sidesteps CORS entirely. */
function jsonp(url, timeoutMs = 15000) {
  return new Promise((resolve, reject) => {
    const cb = 'irondesk_' + Math.random().toString(36).slice(2, 9);
    const tag = document.createElement('script');
    let settled = false;
    const cleanup = () => {
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (tag.parentNode) tag.parentNode.removeChild(tag);
    };
    window[cb] = data => { settled = true; cleanup(); resolve(data); };
    tag.onerror = () => { if (!settled) { cleanup(); reject(new Error('Script failed to load')); } };
    tag.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(tag);
    setTimeout(() => { if (!settled) { cleanup(); reject(new Error('Timed out')); } }, timeoutMs);
  });
}

async function fetchLibrary(url) {
  const target = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'action=library';
  try {
    const r = await fetch(target);
    if (r.ok) return await r.json();
  } catch (e) { /* fall through to JSONP */ }
  return jsonp(target);
}

/* ── Audio: a short two-tone chime, built on the fly ──────────── */
let ac = null;
function unlockAudio() {
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) {}
}
function beep(times = 3) {
  try {
    unlockAudio();
    if (!ac) return;
    for (let i = 0; i < times; i++) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      const t = ac.currentTime + i * 0.22;
      o.type = 'sine';
      o.frequency.setValueAtTime(i === times - 1 ? 1180 : 880, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.2);
    }
  } catch (e) {}
}
function buzz(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

const EXERCISE_GROUPS = CATALOGUE.map(c => c.group);

/* Bump this whenever the catalogue gains movements, so existing installs
   pick them up on next load. */
const CATALOGUE_VERSION = 2;

const SEED_EXERCISES = (() => {
  let list = [];
  CATALOGUE.forEach(c => c.items.forEach(it => {
    list = addExerciseTo(list, it.n, {
      type: it.t, defaultRestSec: it.r, note: it.note, group: c.group, custom: false
    }).list;
  }));
  return list;
})();

const DEFAULT_STATE = {
  catalogueVersion: CATALOGUE_VERSION,
  exercises: SEED_EXERCISES,
  templates: SEED_TEMPLATES,
  history: [],
  session: null,
  settings: { webhookUrl: '', sound: true, vibrate: true, defaultRest: 120, autoSync: true, syncLibrary: true }
};

/* Older saves predate the type/isFavorite fields. Fill them in on load
   rather than making every read site defensive. */
/* Merge the shipped catalogue into an existing library without trampling
   anything you've edited. New movements are added; blank cues, rests and
   groups are filled in from the catalogue; values you set yourself are
   left exactly as they are. */
function syncCatalogue(list) {
  let out = list.slice();
  CATALOGUE.forEach(c => c.items.forEach(it => {
    const ex = findExercise(out, it.n);
    if (!ex) {
      out = addExerciseTo(out, it.n, {
        type: it.t, defaultRestSec: it.r, note: it.note, group: c.group, custom: false
      }).list;
      return;
    }
    const fill = {};
    if (!ex.note) fill.note = it.note;
    if (ex.defaultRestSec == null) fill.defaultRestSec = it.r;
    if (!ex.group || ex.group === 'Other') fill.group = c.group;
    if (Object.keys(fill).length) out = out.map(x => x.id === ex.id ? { ...x, ...fill } : x);
  }));
  return out;
}

function migrate(d) {
  if (!d) return DEFAULT_STATE;
  const s = { ...DEFAULT_STATE, ...d };
  s.settings = { ...DEFAULT_STATE.settings, ...(d.settings || {}) };
  s.exercises = (d.exercises || []).map(e => ({
    type: 'reps', isFavorite: false, custom: true, defaultRestSec: null, note: '', group: 'Other', ...e
  }));

  /* Run the merge once per catalogue release. Gating on a version stamp
     means anything you delete afterwards stays deleted instead of
     reappearing on the next reload. */
  if ((d.catalogueVersion || 0) < CATALOGUE_VERSION) {
    s.exercises = syncCatalogue(s.exercises);
    s.catalogueVersion = CATALOGUE_VERSION;
  } else {
    s.catalogueVersion = d.catalogueVersion;
  }
  s.templates = (d.templates || []).map(t => ({ ...t, items: (t.items || []).map(i => ({ type: 'reps', ...i })) }));
  s.history = d.history || [];
  if (s.session) {
    s.session = {
      ...s.session,
      entries: (s.session.entries || []).map(e => ({
        type: 'reps', ...e,
        sets: (e.sets || []).map(st => ({ duration: '', ...st }))
      }))
    };
  }
  return s;
}

const blankSet = (over = {}) => ({ weight: '', reps: '', duration: '', rpe: '', done: false, ...over });

/* Rest is resolved in order of how specific the instruction is:
   1. a restSec written into this routine (a deliberate prescription)
   2. the exercise's own defaultRestSec from your library
   3. the global fallback in Settings
   Saving a session as a routine strips restSec wherever it already
   matches the library value, so the routine keeps inheriting. */
function restFor(item, library, globalRest) {
  if (item.restSec != null && item.restSec !== '') return Number(item.restSec);
  const ex = findExercise(library, item.name);
  if (ex && ex.defaultRestSec != null) return Number(ex.defaultRestSec);
  return globalRest;
}

/* Same precedence for the form cue: a note written into this routine wins,
   otherwise the exercise carries its own. Edit it once in the library and
   every routine that uses the movement picks it up. */
function noteFor(item, library) {
  if (item.note) return String(item.note);
  const ex = findExercise(library, item.name);
  return ex && ex.note ? ex.note : '';
}

function entriesFromItems(items, settings, library = []) {
  return items.map(it => ({
    id: uid(),
    name: it.name,
    type: it.type === 'time' ? 'time' : 'reps',
    restSec: restFor(it, library, settings.defaultRest),
    repRange: it.repRange || '',
    targetSec: it.targetSec || null,
    note: noteFor(it, library),
    sets: Array.from({ length: it.sets || 3 }, () => blankSet({
      weight: it.weight != null ? String(it.weight) : '',
      duration: it.targetSec != null ? String(it.targetSec) : ''
    }))
  }));
}

/* ────────────────────────────────────────────────────────────────
   Timer engine

   One clock drives everything: rest countdowns, plank countdowns, and
   the stopwatch. It stores a start stamp plus accumulated milliseconds
   rather than a decrementing counter, so pausing is exact and the
   reading stays correct if the tick is throttled in a background tab.
   ──────────────────────────────────────────────────────────────── */
const elapsedMs = (t, now) => (t ? t.accumMs + (t.running ? now - t.startedAt : 0) : 0);

function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState('log');
  const [toast, setToast] = useState('');
  const [timer, setTimer] = useState(null);
  const [dialOpen, setDialOpen] = useState(false);
  const [now, setNow] = useState(Date.now());

  useEffect(() => { store.load().then(d => setState(migrate(d))); }, []);
  useEffect(() => { if (state) store.save(state); }, [state]);

  useEffect(() => {
    const i = setInterval(() => setNow(Date.now()), 100);
    return () => clearInterval(i);
  }, []);

  const say = useCallback(msg => {
    setToast(msg);
    setTimeout(() => setToast(''), 2600);
  }, []);

  /* Countdown reaching zero: chime once, then freeze at the target. */
  useEffect(() => {
    if (!timer || timer.mode !== 'countdown' || !timer.running) return;
    if (timer.targetSec * 1000 - elapsedMs(timer, now) > 0) return;
    if (state?.settings.sound) beep(3);
    if (state?.settings.vibrate) buzz([220, 90, 220, 90, 420]);
    setTimer(t => (t ? { ...t, running: false, startedAt: null, accumMs: t.targetSec * 1000, finished: true } : t));
  }, [now, timer, state]);

  /* Back the library up whenever it actually changes. Debounced, because
     typing a form cue would otherwise fire a request per keystroke, and
     signature-compared so a no-op re-render doesn't trigger a write.
     The first signature is recorded without sending — loading the app
     shouldn't push anything on its own. */
  const libSig = useRef(null);
  useEffect(() => {
    if (!state) return;
    const url = state.settings.webhookUrl.trim();
    const sig = JSON.stringify(libraryRows(state.exercises));
    if (libSig.current === null) { libSig.current = sig; return; }
    if (libSig.current === sig) return;
    if (!url || !state.settings.syncLibrary) { libSig.current = sig; return; }
    const id = setTimeout(() => {
      libSig.current = sig;
      syncLibraryToSheet(state).catch(() => {});
    }, 2500);
    return () => clearTimeout(id);
  }, [state]);

  /* A finished rest bar clears itself so it doesn't sit there mid-set. */
  useEffect(() => {
    if (!timer || !timer.finished || timer.kind !== 'rest' || dialOpen) return;
    const id = setTimeout(() => setTimer(null), 4000);
    return () => clearTimeout(id);
  }, [timer, dialOpen]);

  const startRest = useCallback((secs, label) => {
    unlockAudio();
    setTimer({
      kind: 'rest', mode: 'countdown', targetSec: secs, label: label || 'Rest',
      startedAt: Date.now(), accumMs: 0, running: true, laps: [], sink: null, finished: false
    });
    setDialOpen(false);
  }, []);

  /* Opens the dial bound to a specific set. Whatever it reads when you
     tap "Log" is written straight into that set's duration field. */
  const openDial = useCallback((cfg) => {
    unlockAudio();
    setTimer({
      kind: 'set',
      mode: cfg.mode || 'stopwatch',
      targetSec: cfg.targetSec || 60,
      label: cfg.label || '',
      startedAt: null, accumMs: 0, running: false, laps: [],
      sink: cfg.sink || null, finished: false
    });
    setDialOpen(true);
  }, []);

  const logTimeToSink = useCallback((secs) => {
    const sink = timer?.sink;
    if (!sink) { setDialOpen(false); setTimer(null); return; }
    setState(p => {
      if (!p.session) return p;
      return {
        ...p,
        session: {
          ...p.session,
          entries: p.session.entries.map(e => e.id !== sink.entryId ? e : ({
            ...e,
            sets: e.sets.map((st, i) => i === sink.setIndex ? { ...st, duration: String(secs), done: true } : st)
          }))
        }
      };
    });
    buzz(30);
    setDialOpen(false);
    setTimer(null);
    say(`Logged ${dur(secs)} to set ${sink.setIndex + 1}`);
  }, [timer, say]);

  if (!state) {
    return <div className="h-full grid place-items-center text-muted text-sm">Loading…</div>;
  }

  const props = { state, setState, say, startRest, openDial, setTab };
  // Anything still running stays glanceable once the dial is dismissed.
  const showBar = timer && !dialOpen && (timer.kind === 'rest' || timer.running || timer.finished);

  return (
    <div className="min-h-full flex flex-col bg-ink">
      <header className="safe-t sticky top-0 z-30 bg-ink/95 backdrop-blur border-b border-line">
        <div className="px-5 py-3 flex items-center justify-between">
          <div>
            <div className="text-[11px] uppercase tracking-[0.18em] text-amber font-semibold">Iron Desk</div>
            <div className="text-[11px] text-muted num">{today()}</div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => openDial({ mode: 'stopwatch', label: 'Stopwatch' })}
              className="text-[12px] text-muted border border-line rounded-full px-3 py-1.5">Timer</button>
            {state.session && tab !== 'log' && (
              <button onClick={() => setTab('log')} className="text-[12px] text-amber border border-amber/40 rounded-full px-3 py-1.5">
                Session
              </button>
            )}
          </div>
        </div>
      </header>

      <main className="flex-1 px-4 sm:px-5 pt-4 pb-40">
        {tab === 'log'       && <LogView {...props} />}
        {tab === 'templates' && <TemplatesView {...props} />}
        {tab === 'moves'     && <ExercisesView {...props} />}
        {tab === 'history'   && <HistoryView {...props} />}
        {tab === 'settings'  && <SettingsView {...props} />}
      </main>

      {showBar && (
        <TimerBar
          timer={timer} now={now}
          onExpand={() => setDialOpen(true)}
          onAdd={s => setTimer(t => ({ ...t, targetSec: t.targetSec + s, finished: false, running: true, startedAt: t.startedAt || Date.now() }))}
          onSkip={() => setTimer(null)}
        />
      )}

      {dialOpen && timer && (
        <TimerDial
          timer={timer} now={now}
          onSet={fn => setTimer(t => (t ? fn(t) : t))}
          onClose={() => { setDialOpen(false); if (timer.kind === 'set' && !timer.running && !timer.finished && timer.accumMs === 0) setTimer(null); }}
          onLog={logTimeToSink}
        />
      )}

      {toast && (
        <div className="fixed left-1/2 -translate-x-1/2 bottom-28 z-40 bg-raise border border-line text-txt text-[13px] px-4 py-2.5 rounded-full shadow-xl">
          {toast}
        </div>
      )}

      <nav className="fixed bottom-0 inset-x-0 z-30 bg-panel border-t border-line safe-b">
        <div className="grid grid-cols-5">
          {[
            ['log', 'Log'],
            ['templates', 'Routines'],
            ['moves', 'Exercises'],
            ['history', 'History'],
            ['settings', 'Settings']
          ].map(([k, label]) => (
            <button
              key={k}
              onClick={() => { unlockAudio(); setTab(k); }}
              className={`py-3.5 text-[11px] tracking-wide ${tab === k ? 'text-amber font-semibold' : 'text-muted'}`}
            >
              <span className={`block h-[2px] w-6 mx-auto mb-2 rounded-full ${tab === k ? 'bg-amber' : 'bg-transparent'}`} />
              {label}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

/* ── Compact bar. Readable from arm's length with a barbell still in
      your hands; tap it to open the full dial. Handles both modes so a
      plank countdown or a running stopwatch stays visible. ───────── */
function TimerBar({ timer, now, onExpand, onAdd, onSkip }) {
  const isCountdown = timer.mode === 'countdown';
  const ms = elapsedMs(timer, now);
  const left = Math.ceil((timer.targetSec * 1000 - ms) / 1000);
  const done = isCountdown && left <= 0;
  const shown = isCountdown ? left : Math.floor(ms / 1000);
  const pct = isCountdown
    ? (timer.targetSec > 0 ? clamp((left / timer.targetSec) * 100, 0, 100) : 0)
    : (((ms / 1000) % 60) / 60) * 100;

  const status = done ? 'Complete' : timer.kind === 'rest' ? 'Resting' : isCountdown ? 'Holding' : 'Stopwatch';

  return (
    <div className={`fixed bottom-[68px] inset-x-0 z-40 border-t ${done ? 'border-ok bg-ok/10' : 'border-amber/50 bg-panel'}`}>
      <div className="h-1 bg-line">
        <div className={`h-full ${done ? 'bg-ok' : 'bg-amber'} transition-[width] duration-200`} style={{ width: pct + '%' }} />
      </div>
      <div className="px-5 py-3 flex items-center gap-4">
        <button onClick={onExpand} className="flex-1 min-w-0 text-left">
          <div className={`text-[10px] uppercase tracking-[0.18em] ${done ? 'text-ok ring-live' : 'text-amber'}`}>{status}</div>
          <div className="truncate text-[11px] text-muted">{timer.label}</div>
        </button>
        <button onClick={onExpand} className={`num text-4xl font-bold ${done ? 'text-ok' : 'text-txt'}`}>{mmss(shown)}</button>
        {isCountdown && !done && (
          <button onClick={() => onAdd(30)} className="text-[12px] text-muted border border-line rounded-lg px-2.5 py-2">+30s</button>
        )}
        <button onClick={onSkip} className="text-[12px] text-muted border border-line rounded-lg px-2.5 py-2">
          {done ? 'Clear' : 'Stop'}
        </button>
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────
   Radial dial — countdown and stopwatch in one control
   ──────────────────────────────────────────────────────────────── */
const R = 92;
const CIRC = 2 * Math.PI * R;

function TimerDial({ timer, now, onSet, onClose, onLog }) {
  const ms = elapsedMs(timer, now);
  const isCountdown = timer.mode === 'countdown';
  const leftMs = timer.targetSec * 1000 - ms;
  const done = isCountdown && leftMs <= 0;

  // Countdown drains the ring; the stopwatch sweeps one lap per minute.
  const frac = isCountdown
    ? (timer.targetSec > 0 ? clamp(leftMs / (timer.targetSec * 1000), 0, 1) : 0)
    : ((ms / 1000) % 60) / 60;

  const shownSec = isCountdown ? Math.max(0, Math.ceil(leftMs / 1000)) : Math.floor(ms / 1000);
  const tenths = Math.floor((ms % 1000) / 100);
  const loggable = isCountdown ? Math.round(Math.min(ms, timer.targetSec * 1000) / 1000) : Math.round(ms / 1000);

  const start = () => onSet(t => {
    const spent = t.mode === 'countdown' && (t.targetSec * 1000 - t.accumMs) <= 0;
    return { ...t, running: true, startedAt: Date.now(), accumMs: spent ? 0 : t.accumMs, laps: spent ? [] : t.laps, finished: false };
  });
  const pause = () => onSet(t => ({ ...t, running: false, startedAt: null, accumMs: elapsedMs(t, Date.now()) }));
  const reset = () => onSet(t => ({ ...t, running: false, startedAt: null, accumMs: 0, laps: [], finished: false }));
  const lap = () => onSet(t => ({ ...t, laps: [...t.laps, Math.round(elapsedMs(t, Date.now()) / 1000)] }));
  const bump = s => onSet(t => ({ ...t, targetSec: Math.max(5, t.targetSec + s), finished: false }));

  const ring = done ? '#35D07F' : timer.running ? '#FFB020' : '#8A98A6';

  return (
    <div className="fixed inset-0 z-[60] bg-ink flex flex-col safe-t safe-b" role="dialog" aria-modal="true">
      <div className="px-5 py-4 flex items-center justify-between border-b border-line">
        <Seg
          value={timer.mode}
          onChange={m => onSet(t => ({ ...t, mode: m, running: false, startedAt: null, accumMs: 0, laps: [], finished: false }))}
          size="md"
          options={[{ v: 'countdown', label: 'Countdown' }, { v: 'stopwatch', label: 'Stopwatch' }]}
        />
        <button onClick={onClose} className="text-muted text-3xl leading-none px-2" aria-label="Close timer">×</button>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6">
        {timer.label && <div className="text-[12px] uppercase tracking-[0.16em] text-muted mb-6 text-center">{timer.label}</div>}

        <div className="relative">
          <svg width="240" height="240" viewBox="0 0 240 240" aria-hidden="true">
            <circle cx="120" cy="120" r={R} fill="none" stroke="#2A333B" strokeWidth="10" />
            <circle
              cx="120" cy="120" r={R} fill="none" stroke={ring} strokeWidth="10" strokeLinecap="round"
              strokeDasharray={CIRC}
              strokeDashoffset={CIRC * (1 - frac)}
              transform="rotate(-90 120 120)"
              style={{ transition: timer.running ? 'none' : 'stroke-dashoffset .2s linear' }}
            />
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className={`num font-bold tracking-tight ${done ? 'text-ok' : 'text-txt'} text-[52px] leading-none`}>
              {mmss(shownSec)}
            </div>
            {!isCountdown && <div className="num text-amber text-2xl leading-none mt-1">.{tenths}</div>}
            {isCountdown && (
              <div className="num text-[11px] text-muted mt-2 uppercase tracking-[0.14em]">
                {done ? 'done' : `of ${mmss(timer.targetSec)}`}
              </div>
            )}
          </div>
        </div>

        {isCountdown && (
          <div className="flex items-center gap-2 mt-7">
            <button onClick={() => bump(-15)} className="text-[13px] text-muted border border-line rounded-lg px-3 py-2">−15s</button>
            {[45, 60, 90, 120, 180].map(p => (
              <button key={p} onClick={() => onSet(t => ({ ...t, targetSec: p, accumMs: 0, startedAt: t.running ? Date.now() : null, finished: false }))}
                className={`text-[13px] rounded-lg px-2.5 py-2 border ${timer.targetSec === p ? 'border-amber text-amber' : 'border-line text-muted'}`}>
                {p}
              </button>
            ))}
            <button onClick={() => bump(15)} className="text-[13px] text-muted border border-line rounded-lg px-3 py-2">+15s</button>
          </div>
        )}

        {!isCountdown && timer.laps.length > 0 && (
          <div className="mt-6 w-full max-w-xs max-h-28 overflow-y-auto space-y-1">
            {timer.laps.map((l, i) => {
              const split = i === 0 ? l : l - timer.laps[i - 1];
              return (
                <div key={i} className="flex justify-between num text-[13px] text-muted border-b border-line/60 pb-1">
                  <span>Lap {i + 1}</span><span>+{dur(split)}</span><span className="text-txt">{mmss(l)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>

      <div className="px-6 pb-6 space-y-3">
        <div className="grid grid-cols-3 gap-3">
          <button onClick={reset} className="min-h-[56px] rounded-2xl border border-line text-muted text-[15px]">Reset</button>
          <button onClick={timer.running ? pause : start}
            className={`min-h-[56px] rounded-2xl font-bold text-[16px] ${timer.running ? 'bg-raise border border-amber text-amber' : 'bg-amber text-ink'}`}>
            {timer.running ? 'Pause' : done ? 'Restart' : 'Start'}
          </button>
          <button onClick={lap} disabled={isCountdown || !timer.running}
            className={`min-h-[56px] rounded-2xl border text-[15px] ${isCountdown || !timer.running ? 'border-line text-muted/40' : 'border-line text-txt'}`}>
            Lap
          </button>
        </div>

        {timer.sink && (
          <button onClick={() => onLog(loggable)}
            className="w-full min-h-[56px] rounded-2xl bg-ok text-ink font-bold text-[16px]">
            Log {dur(loggable)} to set {timer.sink.setIndex + 1}
          </button>
        )}
      </div>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────
   Log view — the active session
   ──────────────────────────────────────────────────────────────── */
function LogView({ state, setState, say, startRest, openDial, setTab }) {
  const [pickTemplate, setPickTemplate] = useState(false);
  const [addOpen, setAddOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState('');
  const s = state.session;

  const setSession = updater =>
    setState(prev => ({ ...prev, session: typeof updater === 'function' ? updater(prev.session) : updater }));

  const startBlank = () => {
    setState(p => ({ ...p, session: { id: uid(), name: 'Free session', startedAt: Date.now(), entries: [] } }));
    say('Session started');
  };

  const startFromTemplate = tpl => {
    setState(p => ({
      ...p,
      session: { id: uid(), name: tpl.name, startedAt: Date.now(), entries: entriesFromItems(tpl.items, p.settings, p.exercises) }
    }));
    setPickTemplate(false);
    say(`Loaded ${tpl.name}`);
  };

  /* ── Import a routine generated by Claude ──────────────────── */
  const importRoutine = () => {
    let data;
    try { data = JSON.parse(importText); }
    catch (e) { say("That isn't valid JSON. Check for a missing bracket."); return; }

    const list = Array.isArray(data) ? data : data.exercises || data.items;
    if (!Array.isArray(list) || list.length === 0) {
      say('No exercises found. Expected an "exercises" array.');
      return;
    }

    const items = list.map(it => ({
      name: String(it.name || it.exercise || 'Unnamed'),
      type: (it.type === 'time' || it.targetSec != null || it.durationSec != null) ? 'time' : 'reps',
      sets: Number(it.sets) || 3,
      repRange: String(it.repRange || it.reps || ''),
      restSec: (it.restSec != null || it.rest != null) ? Number(it.restSec != null ? it.restSec : it.rest) : null,
      defaultRestSec: it.defaultRestSec != null ? Number(it.defaultRestSec) : null,
      note: String(it.note || it.cue || ''),
      targetSec: it.targetSec != null ? Number(it.targetSec) : (it.durationSec != null ? Number(it.durationSec) : null),
      weight: it.weight,
      note: String(it.note || it.cue || '')
    }));

    setState(p => {
      // Any name Claude sends that we don't already have joins the library,
      // once, with its tracking mode carried across.
      let lib = p.exercises;
      items.forEach(it => {
        const proposed = it.defaultRestSec != null ? it.defaultRestSec : it.restSec;
        const r = addExerciseTo(lib, it.name, {
          type: it.type, custom: true, defaultRestSec: proposed, note: it.note
        });
        lib = r.list;
        if (!r.added) {
          const fill = {};
          if (proposed != null && r.exercise.defaultRestSec == null) fill.defaultRestSec = Number(proposed);
          if (it.note && !r.exercise.note) fill.note = it.note;
          if (Object.keys(fill).length) lib = lib.map(x => x.id === r.exercise.id ? { ...x, ...fill } : x);
        }
      });
      return {
        ...p,
        exercises: lib,
        session: { id: uid(), name: String(data.name || 'Imported routine'), startedAt: Date.now(), entries: entriesFromItems(items, p.settings, lib) }
      };
    });
    setImportText('');
    setImportOpen(false);
    say(`Imported ${items.length} exercises`);
  };

  if (!s) {
    return (
      <div>
        <h1 className="text-2xl font-bold mb-1">No session running</h1>
        <p className="text-muted text-sm mb-6">Pick a routine, paste one from Claude, or build as you go.</p>
        <div className="space-y-3">
          <Btn tone="primary" className="w-full" onClick={() => setPickTemplate(true)}>Start from a routine</Btn>
          <Btn className="w-full" onClick={() => setImportOpen(true)}>Paste routine from Claude</Btn>
          <Btn className="w-full" onClick={startBlank}>Start an empty session</Btn>
        </div>

        {state.history.length > 0 && (
          <div className="mt-10">
            <h2 className="text-[11px] uppercase tracking-[0.14em] text-muted mb-3">Last session</h2>
            <SessionCard w={state.history[0]} />
          </div>
        )}

        <Sheet open={pickTemplate} onClose={() => setPickTemplate(false)} title="Choose a routine">
          <div className="space-y-2">
            {state.templates.map(t => (
              <button key={t.id} onClick={() => startFromTemplate(t)}
                className="w-full text-left bg-raise border border-line rounded-2xl p-4 active:bg-line">
                <div className="font-semibold">{t.name}</div>
                <div className="text-[12px] text-muted mt-0.5 num">
                  {t.items.length} exercises · {t.items.reduce((a, b) => a + (b.sets || 0), 0)} sets
                </div>
              </button>
            ))}
            {state.templates.length === 0 && <p className="text-muted text-sm">No routines saved yet.</p>}
          </div>
        </Sheet>

        <ImportSheet open={importOpen} onClose={() => setImportOpen(false)}
          value={importText} onChange={setImportText} onImport={importRoutine} />
      </div>
    );
  }

  /* ── Active session ──────────────────────────────────────── */
  const isRepSet = (e, st) => e.type !== 'time';
  const totalVolume = s.entries.reduce((sum, e) =>
    sum + e.sets.reduce((a, st) => a + (st.done && isRepSet(e, st) ? num(st.weight) * num(st.reps) : 0), 0), 0);
  const totalTime = s.entries.reduce((sum, e) =>
    sum + e.sets.reduce((a, st) => a + (st.done && e.type === 'time' ? num(st.duration) : 0), 0), 0);
  const doneSets = s.entries.reduce((a, e) => a + e.sets.filter(x => x.done).length, 0);
  const allSets = s.entries.reduce((a, e) => a + e.sets.length, 0);
  const elapsed = Math.floor((Date.now() - s.startedAt) / 60000);

  const buildExport = () => ({
    app: 'IronDesk', version: 2,
    date: today(),
    workout: s.name,
    durationMin: elapsed,
    totalVolumeKg: Math.round(totalVolume),
    totalTimeSec: Math.round(totalTime),
    exercises: s.entries.map(e => ({
      name: e.name,
      type: e.type || 'reps',
      repRange: e.repRange || null,
      volumeKg: Math.round(e.sets.reduce((a, st) => a + (st.done && e.type !== 'time' ? num(st.weight) * num(st.reps) : 0), 0)),
      timeSec: Math.round(e.sets.reduce((a, st) => a + (st.done && e.type === 'time' ? num(st.duration) : 0), 0)),
      sets: e.sets.filter(x => x.done).map((st, i) => ({
        set: i + 1,
        weightKg: num(st.weight),
        reps: e.type === 'time' ? null : num(st.reps),
        durationSec: e.type === 'time' ? num(st.duration) : null,
        rpe: st.rpe ? num(st.rpe) : null
      }))
    })).filter(e => e.sets.length > 0)
  });

  const buildRows = () => {
    const rows = [];
    s.entries.forEach(e => {
      e.sets.forEach((st, i) => {
        if (!st.done) return;
        const isTime = e.type === 'time';
        // Form cues stay in the app. They're identical on every row, so
        // writing them to the sheet is pure noise.
        rows.push([
          today(), s.name, e.name, e.type || 'reps', i + 1,
          num(st.weight),
          isTime ? '' : num(st.reps),
          isTime ? num(st.duration) : '',
          st.rpe ? num(st.rpe) : '',
          isTime ? '' : Math.round(num(st.weight) * num(st.reps))
        ]);
      });
    });
    return rows;
  };

  const exportJSON = () => {
    copyText(JSON.stringify(buildExport(), null, 2)).then(() => say('Workout JSON copied. Paste it to Claude.'));
  };

  const pushToSheet = async (silent) => {
    const url = state.settings.webhookUrl.trim();
    if (!url) { if (!silent) say('Add your Apps Script URL in Settings first.'); return false; }
    const rows = buildRows();
    if (rows.length === 0) { if (!silent) say('No completed sets to send.'); return false; }
    try {
      await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },  // avoids a CORS preflight
        body: JSON.stringify({ rows })
      });
      if (!silent) say(`Sent ${rows.length} rows to your sheet`);
      return true;
    } catch (err) {
      try {
        await fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rows }) });
        if (!silent) say(`Sent ${rows.length} rows (delivery unconfirmed)`);
        return true;
      } catch (e2) {
        if (!silent) say("Couldn't reach the sheet. Check the URL and your connection.");
        return false;
      }
    }
  };

  const finish = async () => {
    if (doneSets === 0) { say('Tick at least one set before finishing.'); return; }
    if (state.settings.autoSync && state.settings.webhookUrl.trim()) await pushToSheet(true);
    const record = { ...buildExport(), id: s.id, finishedAt: Date.now() };
    setState(p => ({ ...p, history: [record, ...p.history].slice(0, 200), session: null }));
    say('Workout saved');
    setTab('history');
  };

  return (
    <div>
      <div className="flex items-start justify-between gap-3 mb-4">
        <div className="min-w-0">
          <input
            value={s.name}
            onChange={e => setSession(x => ({ ...x, name: e.target.value }))}
            className="bg-transparent text-2xl font-bold w-full focus:outline-none focus:text-amber"
            aria-label="Workout name"
          />
          <div className="text-[12px] text-muted num mt-0.5">
            {elapsed} min · {doneSets}/{allSets} sets · {Math.round(totalVolume).toLocaleString()} kg
            {totalTime > 0 && <> · {dur(Math.round(totalTime))} held</>}
          </div>
        </div>
      </div>

      <div className="space-y-4">
        {s.entries.map((e, ei) => (
          <ExerciseCard
            key={e.id}
            entry={e}
            history={state.history}
            onChange={fn => setSession(x => ({ ...x, entries: x.entries.map((y, i) => i === ei ? fn(y) : y) }))}
            onRemove={() => setSession(x => ({ ...x, entries: x.entries.filter((_, i) => i !== ei) }))}
            onRest={() => startRest(e.restSec || state.settings.defaultRest, e.name)}
            openDial={openDial}
          />
        ))}
      </div>

      <div className="mt-5 space-y-3">
        <Btn className="w-full" onClick={() => setAddOpen(true)}>+ Add exercise</Btn>
        <div className="grid grid-cols-2 gap-3">
          <Btn onClick={exportJSON}>Copy workout JSON</Btn>
          <Btn onClick={() => pushToSheet(false)}>Send to sheet</Btn>
        </div>
        <Btn tone="primary" className="w-full" onClick={finish}>Finish workout</Btn>
        <Btn tone="danger" className="w-full" onClick={() => {
          if (sure('Discard this session? Logged sets will be lost.')) {
            setState(p => ({ ...p, session: null }));
          }
        }}>Discard session</Btn>
      </div>

      <AddExerciseSheet
        open={addOpen}
        onClose={() => setAddOpen(false)}
        state={state}
        setState={setState}
        say={say}
        onPick={(ex) => {
          setSession(x => ({
            ...x,
            entries: [...x.entries, {
              id: uid(), name: ex.name, type: ex.type || 'reps',
              restSec: ex.defaultRestSec != null ? ex.defaultRestSec : state.settings.defaultRest,
              repRange: '', targetSec: null, note: ex.note || '',
              sets: [blankSet()]
            }]
          }));
          setAddOpen(false);
        }}
      />
    </div>
  );
}

/* ── One exercise, with its sets ─────────────────────────────── */
function ExerciseCard({ entry, history, onChange, onRemove, onRest, openDial }) {
  const [open, setOpen] = useState(true);
  const isTime = entry.type === 'time';
  const scrollRef = useRef(null);

  const doneCount = entry.sets.filter(x => x.done).length;
  const allDone = entry.sets.length > 0 && doneCount === entry.sets.length;

  /* Collapse on the transition into "finished", expand again on the
     transition out. Only firing on the edge means a manual tap after the
     auto-collapse sticks — we don't fight the user for control. */
  const wasAllDone = useRef(allDone);
  useEffect(() => {
    if (allDone && !wasAllDone.current) setOpen(false);
    if (!allDone && wasAllDone.current) setOpen(true);
    wasAllDone.current = allDone;
  }, [allDone]);

  /* Only paint the scroll shadow when there is actually overflow. */
  useEffect(() => {
    const el = scrollRef.current;
    if (!el) return;
    const check = () => el.classList.toggle('is-scrollable', el.scrollWidth > el.clientWidth + 1);
    check();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(check) : null;
    if (ro) ro.observe(el);
    window.addEventListener('resize', check);
    return () => { if (ro) ro.disconnect(); window.removeEventListener('resize', check); };
  }, [open, entry.sets.length, isTime]);

  /* Last time you did this movement, set by set. */
  const prior = useMemo(() => {
    for (const w of history) {
      const hit = (w.exercises || []).find(x => x.name === entry.name);
      if (hit && hit.sets && hit.sets.length) {
        return { date: w.date, type: hit.type || 'reps', sets: hit.sets };
      }
    }
    return null;
  }, [history, entry.name]);

  const best = useMemo(() => {
    if (!prior) return null;
    if (prior.type === 'time') {
      const b = prior.sets.reduce((a, x) => ((x.durationSec || 0) > (a.durationSec || 0) ? x : a));
      return `${dur(b.durationSec || 0)} · ${prior.date}`;
    }
    const b = prior.sets.reduce((a, x) => (x.weightKg > a.weightKg ? x : a));
    return `${b.weightKg} kg × ${b.reps} · ${prior.date}`;
  }, [prior]);

  // Ghosted in the empty field, so last session's number is right where
  // you're about to type this session's.
  const ghost = (i, field) => {
    const p = prior && prior.sets[i];
    if (!p) return '—';
    if (field === 'weight') return p.weightKg ? String(p.weightKg) : '—';
    if (field === 'reps') return prior.type !== 'time' && p.reps ? String(p.reps) : '—';
    if (field === 'duration') return prior.type === 'time' && p.durationSec ? String(p.durationSec) : '—';
    return '—';
  };

  const upd = (i, key, val) =>
    onChange(e => ({ ...e, sets: e.sets.map((st, j) => j === i ? { ...st, [key]: val } : st) }));

  const toggle = i => {
    const wasDone = entry.sets[i].done;
    onChange(e => ({ ...e, sets: e.sets.map((st, j) => j === i ? { ...st, done: !st.done } : st) }));
    if (!wasDone) { buzz(30); onRest(); }
  };

  const addSet = () => onChange(e => {
    const prev = e.sets[e.sets.length - 1];
    return { ...e, sets: [...e.sets, blankSet({ weight: prev ? prev.weight : '', duration: prev ? prev.duration : '' })] };
  });

  // What the collapsed header shows instead of the target line.
  const summary = entry.sets.filter(x => x.done).map(st => isTime
    ? `${st.weight ? st.weight + 'kg ' : ''}${num(st.duration)}s`
    : `${num(st.weight)}×${num(st.reps)}`).join('  ·  ');

  const cell = st => `num text-center w-full min-w-0 bg-ink border rounded-lg py-3 text-[17px] focus:outline-none focus:border-amber ${st.done ? 'border-ok/40 text-ok' : 'border-line'}`;

  return (
    <section className={`bg-panel border rounded-2xl overflow-hidden ${allDone ? 'border-ok/30' : 'border-line'}`}>
      <button onClick={() => setOpen(o => !o)}
        aria-expanded={open}
        className="w-full px-4 py-3 flex items-center gap-3 text-left active:bg-raise">
        <span className="flex-1 min-w-0">
          <span className="block font-semibold leading-tight truncate">{entry.name}</span>
          <span className="block text-[11px] text-muted num mt-0.5 truncate">
            {!open && doneCount > 0 ? summary : (
              <>
                {doneCount}/{entry.sets.length} sets
                {isTime
                  ? (entry.targetSec ? ` · target ${dur(entry.targetSec)}` : '')
                  : (entry.repRange ? ` · target ${entry.repRange}` : '')}
                {entry.restSec ? ` · rest ${mmss(entry.restSec)}` : ''}
              </>
            )}
          </span>
        </span>
        <span className={`num text-[11px] px-2 py-1 rounded-md shrink-0 ${allDone ? 'bg-ok/15 text-ok' : 'bg-raise text-muted'}`}>
          {allDone ? (open ? 'done ▾' : 'done ▸') : (open ? '▾' : '▸')}
        </span>
      </button>

      {open && (
        <div className="px-3 pb-4">
          {entry.note && <p className="text-[12px] text-amber/80 mb-3 leading-snug px-1">{entry.note}</p>}

          <div className="flex items-center gap-2 mb-3 px-1">
            <Seg
              value={entry.type || 'reps'}
              onChange={t => onChange(e => ({ ...e, type: t }))}
              options={[{ v: 'reps', label: 'Reps' }, { v: 'time', label: 'Time' }]}
            />
            <label className="flex items-center gap-1 bg-ink border border-line rounded-lg pl-2 pr-1.5 py-1">
              <span className="text-[10px] uppercase tracking-wider text-muted">rest</span>
              <input inputMode="numeric" value={entry.restSec}
                onChange={e => onChange(x => ({ ...x, restSec: num(e.target.value) }))}
                aria-label={`Rest for ${entry.name} in seconds`}
                className="num w-9 bg-transparent text-center text-[13px] text-txt focus:outline-none" />
              <span className="text-[11px] text-muted">s</span>
            </label>
            {best && <span className="text-[11px] text-muted num truncate ml-auto">Last: {best}</span>}
          </div>

          <div ref={scrollRef} className="set-scroll">
            <div className="set-grid text-[10px] uppercase tracking-wider text-muted mb-1.5">
              <span className="set-pin text-center">#</span>
              <span className="text-center">kg</span>
              <span className="text-center">{isTime ? 'secs' : 'reps'}</span>
              <span className="text-center">{isTime ? '⏱' : 'rpe'}</span>
              <span></span>
            </div>

            <div className="space-y-2">
              {entry.sets.map((st, i) => (
                <div key={i} className="set-grid">
                  <span className={`set-pin num text-center text-sm py-3 ${st.done ? 'text-ok' : 'text-muted'}`}>{i + 1}</span>

                  <input inputMode="decimal" placeholder={ghost(i, 'weight')} value={st.weight}
                    onChange={e => upd(i, 'weight', e.target.value)}
                    aria-label={`Set ${i + 1} weight in kg`}
                    className={cell(st)} />

                  {isTime ? (
                    <input inputMode="numeric" placeholder={ghost(i, 'duration')} value={st.duration}
                      onChange={e => upd(i, 'duration', e.target.value)}
                      aria-label={`Set ${i + 1} duration in seconds`}
                      className={cell(st)} />
                  ) : (
                    <input inputMode="numeric" placeholder={ghost(i, 'reps')} value={st.reps}
                      onChange={e => upd(i, 'reps', e.target.value)}
                      aria-label={`Set ${i + 1} reps`}
                      className={cell(st)} />
                  )}

                  {isTime ? (
                    <button
                      onClick={() => openDial({
                        mode: num(st.duration) > 0 ? 'countdown' : 'stopwatch',
                        targetSec: num(st.duration) || entry.targetSec || 60,
                        label: `${entry.name} · set ${i + 1}`,
                        sink: { entryId: entry.id, setIndex: i }
                      })}
                      aria-label={`Time set ${i + 1}`}
                      className="h-12 w-full rounded-lg border border-amber/40 text-amber text-lg active:bg-amber/10">⏱</button>
                  ) : (
                    <input inputMode="decimal" placeholder="—" value={st.rpe}
                      onChange={e => upd(i, 'rpe', e.target.value)}
                      aria-label={`Set ${i + 1} RPE`}
                      className="num text-center w-full min-w-0 bg-ink border border-line rounded-lg py-3 text-sm text-muted focus:outline-none focus:border-amber" />
                  )}

                  <button onClick={() => toggle(i)} aria-label={st.done ? `Undo set ${i + 1}` : `Complete set ${i + 1}`}
                    className={`h-12 w-full rounded-lg border text-lg font-bold ${st.done ? 'bg-ok text-ink border-ok' : 'bg-raise border-line text-muted'}`}>
                    ✓
                  </button>
                </div>
              ))}
            </div>
          </div>

          <div className="flex gap-2 mt-3 px-1">
            <button onClick={addSet} className="flex-1 text-[13px] text-muted border border-line rounded-lg py-2.5 active:bg-raise">+ Set</button>
            <button onClick={onRest} className="flex-1 text-[13px] text-amber border border-amber/40 rounded-lg py-2.5 active:bg-amber/10">Rest</button>
            <button onClick={onRemove} className="px-4 text-[13px] text-bad border border-bad/30 rounded-lg py-2.5">Remove</button>
          </div>
        </div>
      )}
    </section>
  );
}

/* ── Add exercise / create a custom machine name ─────────────── */
function AddExerciseSheet({ open, onClose, state, setState, onPick, say }) {
  const [q, setQ] = useState('');
  const [newType, setNewType] = useState('reps');
  const [newNote, setNewNote] = useState('');
  const [newRest, setNewRest] = useState('');

  const matches = state.exercises.filter(e =>
    normalize(e.name).includes(normalize(q)) || normalize(e.note).includes(normalize(q)));
  const list = [...matches].sort((a, b) =>
    (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0) || a.name.localeCompare(b.name));
  const duplicate = !!findExercise(state.exercises, q);

  const createAndPick = () => {
    const name = q.trim();
    if (!name) return;
    const opts = {
      type: newType,
      defaultRestSec: String(newRest).trim() === '' ? null : Math.max(0, num(newRest)),
      note: newNote
    };
    const r = addExerciseTo(state.exercises, name, opts);
    if (r.added) setState(p => ({ ...p, exercises: addExerciseTo(p.exercises, name, opts).list }));
    onPick(r.exercise);
    setQ(''); setNewNote(''); setNewRest('');
  };

  return (
    <Sheet open={open} onClose={onClose} title="Add exercise">
      <Field placeholder="Search, or type a new machine name" value={q} onChange={e => setQ(e.target.value)} />

      {q.trim() && !duplicate && (
        <div className="mt-3 bg-raise border border-line rounded-xl p-3">
          <textarea rows={2} value={newNote} placeholder="Form cue (optional) — saved to your library"
            onChange={e => setNewNote(e.target.value)}
            className="w-full bg-ink border border-line rounded-lg px-3 py-2 text-[13px] text-amber/90 placeholder-muted/50 focus:outline-none focus:border-amber" />
          <div className="flex items-center gap-2 my-3">
            <Seg value={newType} onChange={setNewType}
              options={[{ v: 'reps', label: 'Reps' }, { v: 'time', label: 'Time' }]} />
            <label className="flex items-center gap-1 bg-ink border border-line rounded-lg pl-2 pr-1.5 py-1">
              <span className="text-[10px] uppercase tracking-wider text-muted">rest</span>
              <input inputMode="numeric" placeholder={String(state.settings.defaultRest)} value={newRest}
                onChange={e => setNewRest(e.target.value)} aria-label="Default rest in seconds"
                className="num w-10 bg-transparent text-center text-[13px] text-txt placeholder-muted/40 focus:outline-none" />
              <span className="text-[11px] text-muted">s</span>
            </label>
          </div>
          <button onClick={createAndPick} className="w-full bg-amber text-ink font-semibold rounded-lg py-3">
            Create “{q.trim()}”
          </button>
        </div>
      )}
      {q.trim() && duplicate && (
        <p className="text-[12px] text-muted mt-2">Already in your library — pick it below.</p>
      )}

      <div className="mt-3 space-y-1.5 max-h-[46vh] overflow-y-auto">
        {list.map(e => (
          <button key={e.id} onClick={() => { onPick(e); setQ(''); }}
            className="w-full text-left bg-raise border border-line rounded-xl px-4 py-3 active:bg-line flex justify-between items-start gap-3">
            <span className="min-w-0">
              <span className="block truncate">{e.isFavorite && <span className="text-amber mr-1.5">★</span>}{e.name}</span>
              {e.note && <span className="block text-[11px] text-muted truncate mt-0.5">{e.note}</span>}
            </span>
            <span className="flex items-center gap-2 shrink-0 pt-0.5">
              {e.type === 'time' && <span className="text-[10px] uppercase tracking-wider text-muted">time</span>}
              <span className="num text-[10px] text-muted">
                {e.defaultRestSec != null ? `${e.defaultRestSec}s` : `${state.settings.defaultRest}s`}
              </span>
            </span>
          </button>
        ))}
        {list.length === 0 && !q.trim() && <p className="text-muted text-sm">Your exercise list is empty.</p>}
      </div>
    </Sheet>
  );
}

/* ────────────────────────────────────────────────────────────────
   Routines
   ──────────────────────────────────────────────────────────────── */
function TemplatesView({ state, setState, say, setTab }) {
  const [editing, setEditing] = useState(null);

  const saveCurrentAsTemplate = () => {
    const s = state.session;
    if (!s) { say('Start a session first, then save it as a routine.'); return; }
    const name = ask('Name this routine', s.name);
    if (!name) return;
    const tpl = {
      id: uid(), name,
      items: s.entries.map(e => {
        const lib = findExercise(state.exercises, e.name);
        const sameRest = lib && lib.defaultRestSec != null && Number(lib.defaultRestSec) === Number(e.restSec);
        const sameNote = lib && lib.note === (e.note || '');
        return {
          name: e.name, type: e.type || 'reps', sets: e.sets.length,
          repRange: e.repRange || '', targetSec: e.targetSec || (e.type === 'time' ? num(e.sets[0]?.duration) || null : null),
          restSec: sameRest ? null : e.restSec,
          note: sameNote ? '' : (e.note || '')
        };
      })
    };
    setState(p => ({ ...p, templates: [...p.templates, tpl] }));
    say('Routine saved');
  };

  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Routines</h1>
      <p className="text-muted text-sm mb-5">Your four training days, ready to load.</p>

      <div className="space-y-3">
        {state.templates.map(t => (
          <div key={t.id} className="bg-panel border border-line rounded-2xl p-4">
            <div className="flex justify-between items-start gap-3">
              <div className="min-w-0">
                <div className="font-semibold">{t.name}</div>
                <div className="text-[12px] text-muted num mt-0.5">
                  {t.items.length} exercises · {t.items.reduce((a, b) => a + (b.sets || 0), 0)} sets
                </div>
              </div>
              <button onClick={() => setEditing(editing === t.id ? null : t.id)} className="text-muted text-[12px] px-2">
                {editing === t.id ? 'Hide' : 'View'}
              </button>
            </div>

            {editing === t.id && (
              <ul className="mt-3 space-y-1.5 border-t border-line pt-3">
                {t.items.map((it, i) => (
                  <li key={i} className="text-[13px] flex justify-between gap-3">
                    <span className="truncate">{it.name}</span>
                    <span className="num text-muted whitespace-nowrap">
                      {it.sets}×{it.type === 'time' ? dur(it.targetSec || 0) : it.repRange}
                    </span>
                  </li>
                ))}
              </ul>
            )}

            <div className="grid grid-cols-2 gap-2 mt-3">
              <button
                onClick={() => {
                  setState(p => ({
                    ...p,
                    session: { id: uid(), name: t.name, startedAt: Date.now(), entries: entriesFromItems(t.items, p.settings, p.exercises) }
                  }));
                  setTab('log');
                }}
                className="bg-amber text-ink font-semibold rounded-xl py-3">Start</button>
              <button
                onClick={() => { if (sure(`Delete ${t.name}?`)) setState(p => ({ ...p, templates: p.templates.filter(x => x.id !== t.id) })); }}
                className="text-bad border border-bad/30 rounded-xl py-3 text-[14px]">Delete</button>
            </div>
          </div>
        ))}
      </div>

      <Btn className="w-full mt-4" onClick={saveCurrentAsTemplate}>Save current session as a routine</Btn>
    </div>
  );
}

/* ────────────────────────────────────────────────────────────────
   Exercise library
   ──────────────────────────────────────────────────────────────── */
function ExercisesView({ state, setState, say }) {
  const [q, setQ] = useState('');
  const [filter, setFilter] = useState('all');
  const [openId, setOpenId] = useState(null);
  const [draft, setDraft] = useState({ name: '', type: 'reps', rest: '', note: '', group: 'Other' });

  const groups = useMemo(() => {
    const seen = [];
    state.exercises.forEach(e => { if (e.group && !seen.includes(e.group)) seen.push(e.group); });
    const order = EXERCISE_GROUPS.filter(g => seen.includes(g));
    return [...order, ...seen.filter(g => !order.includes(g))];
  }, [state.exercises]);

  const add = () => {
    const clean = draft.name.trim();
    if (!clean) return;
    if (findExercise(state.exercises, clean)) { say(`“${clean}” is already in your library`); return; }
    setState(p => ({
      ...p,
      exercises: addExerciseTo(p.exercises, clean, {
        type: draft.type,
        defaultRestSec: String(draft.rest).trim() === '' ? null : Math.max(0, num(draft.rest)),
        note: draft.note,
        group: draft.group
      }).list
    }));
    setDraft({ name: '', type: 'reps', rest: '', note: '', group: draft.group });
    say('Exercise added');
  };

  const patch = (id, fields) => setState(p => ({
    ...p, exercises: p.exercises.map(e => e.id === id ? { ...e, ...fields } : e)
  }));

  const shown = useMemo(() => state.exercises
    .filter(e => {
      if (filter === 'fav' && !e.isFavorite) return false;
      if (filter !== 'all' && filter !== 'fav' && e.group !== filter) return false;
      if (!q.trim()) return true;
      return normalize(e.name).includes(normalize(q)) || normalize(e.note).includes(normalize(q));
    })
    .sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0) || a.name.localeCompare(b.name)),
    [state.exercises, filter, q]);

  const chip = (v, label) => (
    <button key={v} onClick={() => setFilter(v)}
      className={`shrink-0 rounded-full px-3 py-1.5 text-[12px] border transition-colors ${
        filter === v ? 'bg-amber text-ink border-amber font-semibold' : 'border-line text-muted'}`}>
      {label}
    </button>
  );

  return (
    <div>
      <h1 className="text-2xl font-bold mb-1">Exercises</h1>
      <p className="text-muted text-sm mb-4">
        {state.exercises.length} movements. The rest time and form cue you set here follow the
        exercise into every routine and session that uses it.
      </p>

      <Field placeholder="Search names and cues" value={q} onChange={e => setQ(e.target.value)} className="mb-3" />

      <div className="flex gap-2 overflow-x-auto pb-1 mb-4 -mx-4 px-4">
        {chip('all', 'All')}
        {chip('fav', '★')}
        {groups.map(g => chip(g, g))}
      </div>

      <div className="space-y-1.5">
        {shown.map(e => {
          const isOpen = openId === e.id;
          return (
            <div key={e.id} className="bg-panel border border-line rounded-xl">
              <div className="flex items-center gap-2 px-3 py-2.5">
                <button onClick={() => patch(e.id, { isFavorite: !e.isFavorite })} aria-label={`Favourite ${e.name}`}
                  className={`text-lg px-1 ${e.isFavorite ? 'text-amber' : 'text-line'}`}>★</button>
                <button onClick={() => setOpenId(isOpen ? null : e.id)} className="flex-1 min-w-0 text-left">
                  <span className="block text-[14px] truncate">{e.name}</span>
                  <span className="block text-[11px] text-muted truncate mt-0.5">
                    {e.note
                      ? e.note
                      : <span className="italic opacity-60">No cue yet — tap to add one</span>}
                  </span>
                </button>
                <span className="num text-[10px] text-muted shrink-0">
                  {e.type === 'time' ? 'time' : 'reps'} · {e.defaultRestSec != null ? `${e.defaultRestSec}s` : `${state.settings.defaultRest}s`}
                </span>
                <span className="text-muted text-[11px] shrink-0">{isOpen ? '▾' : '▸'}</span>
              </div>

              {isOpen && (
                <div className="px-3 pb-3 pt-1 border-t border-line space-y-3">
                  <label className="block">
                    <span className="block text-[10px] uppercase tracking-[0.12em] text-muted mb-1.5">Form cue</span>
                    <textarea rows={2} value={e.note} placeholder="e.g. Elbows 45°, blades pinned"
                      onChange={ev => patch(e.id, { note: ev.target.value })}
                      className="w-full bg-ink border border-line rounded-lg px-3 py-2 text-[13px] text-amber/90 placeholder-muted/50 focus:outline-none focus:border-amber" />
                  </label>

                  <div className="flex items-center gap-2 flex-wrap">
                    <Seg value={e.type || 'reps'} onChange={t => patch(e.id, { type: t })}
                      options={[{ v: 'reps', label: 'Reps' }, { v: 'time', label: 'Time' }]} />
                    <label className="flex items-center gap-1 bg-ink border border-line rounded-lg pl-2 pr-1.5 py-1">
                      <span className="text-[10px] uppercase tracking-wider text-muted">rest</span>
                      <input inputMode="numeric" placeholder={String(state.settings.defaultRest)}
                        value={e.defaultRestSec == null ? '' : e.defaultRestSec}
                        onChange={ev => patch(e.id, {
                          defaultRestSec: String(ev.target.value).trim() === '' ? null : Math.max(0, num(ev.target.value))
                        })}
                        aria-label={`Default rest for ${e.name} in seconds`}
                        className="num w-10 bg-transparent text-center text-[13px] text-txt placeholder-muted/40 focus:outline-none" />
                      <span className="text-[11px] text-muted">s</span>
                    </label>
                    <span className="text-[11px] text-muted">{e.group}</span>
                    <button onClick={() => {
                      if (sure(`Delete ${e.name} from your library?`)) {
                        setState(p => ({ ...p, exercises: p.exercises.filter(x => x.id !== e.id) }));
                        setOpenId(null);
                      }
                    }} className="ml-auto text-[12px] text-bad border border-bad/30 rounded-lg px-3 py-1.5">Delete</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {shown.length === 0 && <p className="text-muted text-sm">Nothing matches that search.</p>}
      </div>

      <div className="bg-panel border border-line rounded-2xl p-4 mt-6">
        <h2 className="text-[11px] uppercase tracking-[0.14em] text-muted mb-3">Add an exercise</h2>
        <Field placeholder="e.g. Yellow Lever Chest Press" value={draft.name}
          onChange={e => setDraft(d => ({ ...d, name: e.target.value }))} />
        <textarea rows={2} value={draft.note} placeholder="Form cue — what you want to read mid-set"
          onChange={e => setDraft(d => ({ ...d, note: e.target.value }))}
          className="w-full mt-2 bg-ink border border-line rounded-xl px-3 py-2 text-[13px] text-amber/90 placeholder-muted/50 focus:outline-none focus:border-amber" />
        <div className="flex items-center gap-2 mt-3 flex-wrap">
          <Seg value={draft.type} onChange={t => setDraft(d => ({ ...d, type: t }))}
            options={[{ v: 'reps', label: 'Reps' }, { v: 'time', label: 'Time' }]} />
          <label className="flex items-center gap-1 bg-ink border border-line rounded-lg pl-2 pr-1.5 py-1">
            <span className="text-[10px] uppercase tracking-wider text-muted">rest</span>
            <input inputMode="numeric" placeholder={String(state.settings.defaultRest)} value={draft.rest}
              onChange={e => setDraft(d => ({ ...d, rest: e.target.value }))} aria-label="Default rest in seconds"
              className="num w-10 bg-transparent text-center text-[13px] text-txt placeholder-muted/40 focus:outline-none" />
            <span className="text-[11px] text-muted">s</span>
          </label>
          <select value={draft.group} onChange={e => setDraft(d => ({ ...d, group: e.target.value }))}
            aria-label="Group"
            className="bg-ink border border-line rounded-lg px-2 py-2 text-[13px] text-txt focus:outline-none focus:border-amber">
            {[...EXERCISE_GROUPS, 'Other'].map(g => <option key={g} value={g}>{g}</option>)}
          </select>
          <Btn tone="primary" onClick={add} className="px-6 ml-auto">Add</Btn>
        </div>
      </div>
    </div>
  );
}

function SessionCard({ w }) {

    <div className="bg-panel border border-line rounded-2xl p-4">
      <div className="flex justify-between items-baseline gap-3">
        <span className="font-semibold truncate">{w.workout}</span>
        <span className="num text-[11px] text-muted">{w.date}</span>
      </div>
      <div className="num text-[12px] text-muted mt-1">
        {(w.totalVolumeKg || 0).toLocaleString()} kg
